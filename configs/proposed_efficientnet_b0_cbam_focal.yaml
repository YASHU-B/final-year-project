experiment_name: efficientnet_b0_cbam_focal_targeted_augmentation
seed: 42

data:
  raw_data_dir: data/raw
  split_dir: data/splits
  image_size: 224
  batch_size: 16
  num_workers: 0
  targeted_augmentation: true
  targeted_classes: [akiec, bcc, bkl, df, mel, vasc]

model:
  backbone: efficientnet_b0
  pretrained: true
  use_cbam: true
  cbam_reduction_ratio: 16
  num_classes: 7

loss:
  name: focal
  gamma: 2.0
  alpha_strategy: effective_number
  effective_number_beta: 0.999

training:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 5
